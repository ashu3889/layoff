version: '1.0'

services:
  database:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: . # Points to your backend source code directory
    container_name: backend_app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=myapp
    depends_on:
      - database
  frontend:
    build: './frontend'
    ports:
      - 8080:80
    environment:
      - API_URL=http://backend:4000

volumes:
  pg_data: