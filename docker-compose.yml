version: '1.0'

services:
  backend:
    build: './backend'
    ports:
      - 3000:4000
    environment:
      - NODE_ENV=development
  frontend:
    build: './frontend'
    ports:
      - 8080:80
    environment:
      - API_URL=http://backend:4000
  database:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: